  <style>
    :root {
      --military-green: #5a6344;
      --light-military: #7c875d;
      --orange-accent: #d6a848;
      --dark-charcoal: #2c2c2c;
      --light-gray: #fcfcfc;
      --white: #ffffff;
      --primary-brand: #5a6344;
    }
    * { font-family: 'cairo', 'Inter', sans-serif; }
    body { background: var(--light-gray); padding-top: 120px; }

    /* Navbar styling */
    .navbar-nav .nav-link {
      transition: color 0.3s, background-color 0.3s, transform 0.2s;
      border-radius: 8px;
      margin: 0 4px;
      font-weight: 500;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link:focus {
      color: var(--white) !important;
      background: linear-gradient(135deg, var(--military-green), var(--light-military));
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 93, 35, 0.3);
    }
    .navbar-brand {
      font-weight: 700 !important;
      color: var(--military-green) !important;
      font-size: 1.7rem;
      letter-spacing: 1px;
    }
    /* Cart Items */
    .cart-item-card {
      margin-bottom: 1.2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(113, 81, 0, 0.09);
      border: none;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 0;
      transition: box-shadow 0.3s;
    }
    .cart-item-card:hover {
      box-shadow: 0 18px 48px rgba(113, 81, 0, 0.14);
    }
    .cart-item-img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      background: var(--light-gray);
      border-radius: 16px 0 0 16px;
      border-right: 1px solid #f2f2f2;
      margin-right: 0;
      display: block;
    }
    .cart-item-info {
      flex: 1 1 auto;
      padding: 1.25rem 1rem;
      min-width: 0;
    }
    .cart-item-title {
      font-weight: 700;
      font-size: 1.07rem;
      margin-bottom: 0.25rem;
      color: var(--dark-charcoal);
    }
    .cart-item-price {
      color: var(--orange-accent);
      font-weight: 600;
      margin-bottom: 0.3rem;
      font-size: 1.08rem;
    }
    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .quantity-controls button {
      min-width: 32px;
      min-height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--military-green);
      color: #fff;
      font-size: 1.14rem;
      font-weight: bold;
      transition: background 0.22s;
    }
    .quantity-controls button:hover {
      background: var(--orange-accent);
      color: var(--dark-charcoal);
    }
    .cart-item-remove-btn {
      color: #d33;
      font-size: 1.25rem;
      margin-left: 12px;
      background: none;
      border: none;
      transition: color 0.2s;
    }
    .cart-item-remove-btn:hover {
      color: #fff;
      background: #d33;
      border-radius: 8px;
    }
    /* Checkout section */
    #cart-total {
      font-weight: 700;
      color: var(--military-green);
      font-size: 1.3rem;
      margin-top: 1.8rem;
    }
    #checkout-button {
      background: var(--orange-accent);
      color: var(--dark-charcoal);
      border: none;
      font-weight: 600;
      padding: 1rem 0;
      font-size: 1.19rem;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(232,123,25,0.10);
      letter-spacing: 0.2px;
      margin-bottom: 2rem;
      margin-top: 0.7rem;
      transition: background 0.18s, color 0.18s;
    }
    #checkout-button:hover {
      background: var(--military-green);
      color: #fff;
    }
    @media (max-width: 767px) {
      .cart-item-card {
        flex-direction: column;
        align-items: flex-start;
        border-radius: 18px;
      }
      .cart-item-img {
        width: 100%;
        max-width: 200px;
        height: 140px;
        border-radius: 18px 18px 0 0;
        margin-bottom: 0;
        margin-right: 0;
      }
      .cart-item-info {
        padding: 1rem 0.7rem 1rem 0.7rem;
      }
    }
    @media (max-width: 600px) {
      main { padding: 0 0.2rem;}
    }
    /* Footer styling */
    
    
    
    
    footer a:hover {
      color: var(--orange-accent) !important;
      text-shadow: 0 0 8px rgba(255, 191, 0, 0.25);
    }

<body>
  <!-- Navbar -->
  <div id="global-navbar"></div>
  <main class="container my-5" dir="rtl">
    <h1 class="mb-4 text-center"><i class="bi bi-cart-check me-2"></i>إتمام الطلب</h1>
    
    <div class="row g-4">
      <!-- Right Column in RTL: Cart Items -->
      <div class="col-lg-5">
        <div class="p-3 p-md-4 rounded-4 bg-white shadow-sm border h-100">
          <h5 class="mb-3 text-secondary border-bottom pb-2"><i class="bi bi-basket me-2"></i>منتجاتك</h5>
          
          <!-- Cart items -->
          <div id="cart-container" class="d-flex flex-column gap-2 mb-3">
            <!-- Cart items dynamically inserted here as cards -->
          </div>
        </div>
      </div>
      
      <!-- Left Column in RTL: Simplified Checkout Form -->
      <div class="col-lg-7">
        <div class="p-3 p-md-4 rounded-4 bg-white shadow-sm border h-100">
          <h5 class="mb-3 text-secondary border-bottom pb-2"><i class="bi bi-person-lines-fill me-2"></i>معلومات الاتصال (إجباري)</h5>
          
          <form id="checkout-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label small text-muted mb-1">الاسم</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                  <input type="text" id="firstName" name="firstName" maxlength="40" class="form-control border-start-0 ps-0" placeholder="اسمك الأول" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label small text-muted mb-1">اللقب</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                  <input type="text" id="lastName" name="lastName" maxlength="40" class="form-control border-start-0 ps-0" placeholder="لقب العائلة" required>
                </div>
              </div>
              <div class="col-12">
                <label for="shippingName" class="form-label small text-muted mb-1">رقم الهاتف</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-secondary"></i></span>
                  <input type="tel" id="shippingName" name="shippingName" maxlength="11" class="form-control border-start-0 ps-0" placeholder="مثال: 0555444332" required>
                </div>
              </div>
              
              <h5 class="mb-2 mt-4 text-secondary border-bottom pb-2"><i class="bi bi-truck me-2"></i>معلومات التوصيل</h5>
              
              <div class="col-md-6">
                <label for="city" class="form-label small text-muted mb-1">الولاية (تحدد سعر التوصيل)</label>
                <select id="city" name="city" class="form-select" required>
                  <option value="">اختر الولاية...</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="province" class="form-label small text-muted mb-1">المنطقة أو البلدية</label>
                <input type="text" id="province" name="province" class="form-control" placeholder="اكتب البلدية" required>
              </div>
            </div>
            
            <!-- Price Summary -->
            <div class="price-summary p-3 bg-light rounded-3 mt-4 mb-3 border">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">مجموع المنتجات:</span>
                <span id="cart-total" class="fw-semibold">دج0.00</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">تكلفة الشحن:</span>
                <span id="delivery-cost" class="fw-semibold">دج0.00</span>
              </div>
              <div class="d-flex justify-content-between pt-2 border-top mt-2">
                <span class="fw-bold text-dark fs-5">المجموع الكلي:</span>
                <span id="final-total" class="fw-bold text-dark fs-5">دج0.00</span>
              </div>
              <p class="text-muted mt-2 mb-0 text-center" style="font-size:0.75rem; background-color: rgba(0, 128, 0, 0.1); padding: 5px; border-radius: 4px;">سيتم التواصل معكم لتأكيد الطلبية</p>
            </div>
            
            <button type="submit" id="checkout-button" class="btn btn-primary w-100 py-2 fw-semibold fs-5" style="background: var(--orange-accent); color: #000; border: none; border-radius: 12px; box-shadow: 0 4px 12px rgba(214, 168, 72, 0.3);">
              <i class="bi bi-check-circle me-2"></i>تأكيد الطلب
            </button>
            <div id="checkout-message" class="mt-3 text-center"></div>
          </form>
        </div>
      </div>
      
    </div>
  </main>
