  <script>
    // Interactive star rating for the review form (1 to 5 natural order)
    function initStarRating() {
      const container = document.getElementById('star-rating');
      if (!container) return;
      const labels = container.querySelectorAll('label');
      const inputs = container.querySelectorAll('input[type="radio"]');

      function highlightStars(val) {
        labels.forEach(lbl => {
          const starVal = parseInt(lbl.getAttribute('data-val') || lbl.htmlFor.replace('star', ''));
          if (starVal <= val) {
            lbl.style.color = 'var(--orange-accent, #ffbf00)';
          } else {
            lbl.style.color = '#dadada';
          }
        });
      }

      function getSelectedVal() {
        const checked = container.querySelector('input[type="radio"]:checked');
        return checked ? parseInt(checked.value) : 0;
      }

      labels.forEach(lbl => {
        const val = parseInt(lbl.getAttribute('data-val') || lbl.htmlFor.replace('star', ''));

        lbl.addEventListener('mouseenter', () => {
          highlightStars(val);
        });

        lbl.addEventListener('click', (e) => {
          e.preventDefault();
          const radio = document.getElementById(lbl.htmlFor);
          if (radio) {
            radio.checked = true;
            radio.dispatchEvent(new Event('change', { bubbles: true }));
          }
          highlightStars(val);
        });
      });

      container.addEventListener('mouseleave', () => {
        highlightStars(getSelectedVal());
      });

      inputs.forEach(input => {
        input.addEventListener('change', () => {
          highlightStars(getSelectedVal());
        });
      });

      highlightStars(getSelectedVal());
    }

    document.addEventListener('DOMContentLoaded', initStarRating);

  </script>
  <script>
    async function updateBrandingLinks() {
      // Use cached branding data for better performance
      const cacheKey = 'branding_data';
      const cached = localStorage.getItem(`cache_${cacheKey}`);
      let branding;

      if (cached) {
        try {
          const data = JSON.parse(cached);
          const age = Date.now() - data.timestamp;
          if (age < 15 * 60 * 1000) { // 15 minutes
            branding = data.value;
          }
        } catch { }
      }

      if (!branding) {
        const res = await fetch('/api/branding', {
          headers: {
            'Cache-Control': 'public, max-age=900'
          }
        });
        branding = await res.json();

        // Cache the branding data
        try {
          localStorage.setItem(`cache_${cacheKey}`, JSON.stringify({
            value: branding,
            timestamp: Date.now()
          }));
        } catch { }
      }

      // Update social links (use your real selectors/IDs as needed)
      document.querySelectorAll('a.social-facebook').forEach(a => a.href = branding.facebook || '#');
      document.querySelectorAll('a.social-instagram').forEach(a => a.href = branding.instagram || '#');
      document.querySelectorAll('a.social-tiktok').forEach(a => a.href = branding.tiktok || '#');
      // Phone numbers
      document.querySelectorAll('.branding-phone').forEach(span => span.textContent = branding.phone || '');
    }
    updateBrandingLinks();
  </script>
