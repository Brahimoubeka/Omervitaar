﻿<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omervita - إدارة الطلبات</title>
  <meta name="description" content="لوحة إدارة الطلبات في Omervita. مراجعة وتتبع ومعالجة طلبات العملاء وحالات الشحن.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --military-green: #715100;
      --light-military: #bb7900;
      --orange-accent: #ffbf00;
      --dark-charcoal: #2c2c2c;
      --light-gray: #f8f9fa;
      --white: #ffffff;
    }

    * {
      font-family: 'Inter', sans-serif;
    }

    /* Navbar styling */
    .navbar-nav .nav-link {
      transition: color 0.3s, background-color 0.3s, transform 0.2s;
      border-radius: 8px;
      margin: 0 4px;
      font-weight: 500;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link:focus {
      color: var(--white) !important;
      background: linear-gradient(135deg, var(--military-green), var(--light-military));
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 93, 35, 0.3);
    }
    .navbar-brand {
      font-weight: 700 !important;
      color: var(--military-green) !important;
      font-size: 1.7rem;
      letter-spacing: 1px;
    }
    .navbar.fixed-top {
      backdrop-filter: blur(10px);
      background: rgba(248, 249, 250, 0.95) !important;
      transition: all 0.3s;
    }
    body {
      background: var(--light-gray);
      padding-top: 140px;
    }

    /* Main title */
    main h1 {
      font-weight: 700;
      color: var(--military-green);
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    /* Orders List Group */
    #admin-orders-container.list-group {
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(44,44,44,0.07);
      background: #fff;
      padding: 1.5rem 1rem;
      margin-bottom: 2rem;
      min-height: 180px;
    }
  .flex-grow-1{
    font-size: 0.8rem;
  }
    .list-group-item {
      border-radius: 12px !important;
      margin-bottom: 0.5rem;
      border: none;
      background: linear-gradient(90deg, var(--light-gray) 70%, #ffe7a7 100%);
      transition: background 0.3s, box-shadow 0.2s, transform 0.2s;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .list-group-item.active, .list-group-item:hover {
      background: linear-gradient(90deg, var(--orange-accent) 65%, var(--light-military) 100%) !important;
      color: var(--dark-charcoal) !important;
      box-shadow: 0 2px 16px rgba(255,191,0,0.07);
      transform: scale(1.01);
    }
    
    /*Pagination Buttons Styling */
    #pagination-controls {
        display: none; /* Hidden by default, shown by JS if needed */
    }
    #pagination-controls .btn {
        min-width: 180px;
        font-weight: 600;
    }
    
    /* Date filter styling */
    .date-filter-container {
        width: 180px;
    }
    #date-filter {
        border-radius: 20px;
        border: 1px solid var(--light-military);
        font-weight: 500;
        padding: 0.5rem 1rem;
        background-color: white;
        transition: box-shadow 0.2s, border-color 0.2s;
    }
    #date-filter:focus {
        box-shadow: 0 0 0 0.25rem rgba(255, 191, 0, 0.25);
        border-color: var(--orange-accent);
    }
    #orders-count {
        font-size: 0.9rem;
        background: linear-gradient(135deg, var(--military-green), var(--light-military)) !important;
    }

    /* Modal style upgrades */
    .modal-content {
      border-radius: 20px;
      border: none;
      box-shadow: 0 8px 30px rgba(113, 81, 0, 0.10);
    }
    .modal-header {
      border-radius: 20px 20px 0 0;
      background: linear-gradient(135deg, var(--military-green), var(--orange-accent));
      color: #fff;
      border-bottom: none;
    }
    .modal-title {
      font-weight: 700;
      font-size: 1.35rem;
      color: #fff;
    }
    .modal-
    .modal-body {
      font-size: 1.06rem;
    }
    .modal .btn-secondary {
      background: var(--military-green);
      color: #fff !important;
      border: none;
      font-weight: 500;
      border-radius: 30px;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.3px;
      padding: 7px 26px;
    }
    .modal .btn-secondary:hover {
      background: var(--orange-accent);
      color: var(--dark-charcoal) !important;
      box-shadow: 0 6px 20px rgba(255,191,0,.13);
    }
    .modal .btn-warning, #archive-order-confirm-btn {
      background: var(--orange-accent) !important;
      color: var(--dark-charcoal) !important;
      font-weight: 600;
      border-radius: 30px;
      padding: 8px 28px;
      box-shadow: 0 2px 10px rgba(232,123,25,0.12);
      transition: background 0.2s, color 0.2s;
    }
    .modal .btn-warning:hover, #archive-order-confirm-btn:hover {
      background: var(--military-green) !important;
      color: #fff !important;
    }
    .modal-header.bg-warning {
      background: linear-gradient(135deg, #ffd65a, var(--orange-accent)) !important;
      color: var(--dark-charcoal) !important;
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
      main h1 { font-size: 1.3rem; }
      #admin-orders-container { padding: 1rem 0.5rem; }
      .modal-header, .modal-
    }

    /* Footer styling (modern, dark, with accent) */
    
    
    
    
    footer a:hover {
      color: var(--orange-accent) !important;
      text-shadow: 0 0 8px rgba(255, 191, 0, 0.25);
    }
    
    
    
    
    
    
    
    
    
    

    


    .animate-fade-in { animation: fadeInUp 0.8s ease-out;}

    /* Date filter animation */
    @keyframes highlight-filter {
        0% { background-color: white; }
        50% { background-color: rgba(255, 191, 0, 0.2); }
        100% { background-color: white; }
    }
    
    .filter-changed {
        animation: highlight-filter 1s ease-out;
    }
  </style>
  <link rel="stylesheet" href="/css/global-ui.css">
</head>
<body>
  <!-- Navbar -->
  <div id="global-navbar"></div>

  <main class="container my-5 animate-fade-in">
    <h1 class="mb-4"><i class="bi bi-truck me-2"></i>مجموعات الطلبات</h1>

    <!-- Date Filter -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="date-filter-container">
        <select id="date-filter" class="form-select form-select-sm" aria-label="تصفية حسب التاريخ">
          <option value="all" selected>جميع الطلبات</option>
          <option value="24h">آخر 24 ساعة</option>
          <option value="7d">آخر 7 أيام</option>
          <option value="1m">آخر شهر</option>
        </select>
      </div>
      <div id="orders-count" class="badge bg-primary rounded-pill p-2">
        إجمالي الطلبات: <span id="total-orders-count">0</span>
      </div>
    </div>

    <!-- Order groups -->
    <div id="admin-orders-container" class="list-group">
      <!-- Order groups list goes here -->
    </div>

    <!-- Pagination Buttons -->
    <div id="pagination-controls" class="text-center mt-4">
        <button id="show-more-btn" class="btn btn-primary">عرض المزيد</button>
        <button id="show-less-btn" class="btn btn-secondary" style="display: none;">عرض أقل</button>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderDetailsModalLabel"><i class="bi bi-list-task me-2"></i>تفاصيل مجموعة الطلبات</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body" id="modal-order-details">
          <!-- Order details will be populated here -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Archive Order Group Modal -->
  <div class="modal fade" id="archiveOrderModal" tabindex="-1" aria-labelledby="archiveOrderModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-warning">
        <div class="modal-header bg-warning bg-opacity-75">
          <h5 class="modal-title text-dark" id="archiveOrderModalLabel"><i class="bi bi-archive me-2"></i>أرشفة مجموعة الطلبات؟</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body text-dark">
          <p>هل أنت متأكد أنك تريد أرشفة مجموعة الطلبات هذه؟</p>
          <p id="archive-order-modal-group" class="fw-bold"></p>
          <div class="alert alert-warning my-2" role="alert">
            <strong>تنبيه:</strong> بعد الأرشفة لن تظهر مجموعة الطلبات في قائمة الطلبات!
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" id="archive-order-confirm-btn" class="btn btn-warning">نعم، أرشف</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Updated Footer with better mobile centering -->
<div id="global-footer"></div>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/header.js?v=1736152800"></script>
  <script src="/js/admin-orders.js?v=1736152800"></script>
  <script src="/js/branding.js?v=1736152800"></script>

  
</body>
</html>
