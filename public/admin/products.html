<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omervita - إدارة المنتجات</title>
  <meta name="description" content="لوحة إدارة المنتجات في Omervita. إضافة وتحرير وحذف المنتجات وإدارة المخزون والفئات.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --military-green: #715100;
      --light-military: #bb7900;
      --orange-accent: #ffbf00;
      --dark-charcoal: #2c2c2c;
      --light-gray: #f8f9fa;
      --white: #ffffff;
    }

    * {
      font-family: 'Inter', sans-serif;
    }

    /* Navbar styling */
    .navbar-nav .nav-link {
      transition: color 0.3s, background-color 0.3s, transform 0.2s;
      border-radius: 8px;
      margin: 0 4px;
      font-weight: 500;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link:focus {
      color: var(--white) !important;
      background: linear-gradient(135deg, var(--military-green), var(--light-military));
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 93, 35, 0.3);
    }
    .navbar-brand {
      font-weight: 700 !important;
      color: var(--military-green) !important;
      font-size: 1.7rem;
      letter-spacing: 1px;
    }
    .navbar.fixed-top {
      backdrop-filter: blur(10px);
      background: rgba(248, 249, 250, 0.95) !important;
      transition: all 0.3s;
    }
    body {
      background: var(--light-gray);
      padding-top: 140px;
    }

    /* Main title */
    main h1 {
      font-weight: 700;
      color: var(--military-green);
      letter-spacing: 0.5px;
    }

    /* Add Product button */
    #add-product-button, .btn-primary, .modal-footer .btn-primary {
      background: var(--orange-accent);
      color: var(--dark-charcoal) !important;
      border: none;
      font-weight: 600;
      padding: 13px 38px;
      border-radius: 50px;
      transition: background 0.3s, color 0.2s, box-shadow 0.2s, transform 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(232,123,25,0.13);
      font-size: 20px;
      margin: 2px;
    }
    #add-product-button:hover, .btn-primary:hover, .modal-footer .btn-primary:hover {
      background: var(--military-green);
      color: #fff !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(113, 81, 0, 0.10);
    }

    /* Modal style upgrades */
    .modal-content {
      border-radius: 20px;
      border: none;
      box-shadow: 0 8px 30px rgba(113, 81, 0, 0.10);
    }
    .modal-header {
      border-radius: 20px 20px 0 0;
      background: linear-gradient(135deg, var(--military-green), var(--orange-accent));
      color: #fff;
      border-bottom: none;
    }
    .modal-title {
      font-weight: 700;
      font-size: 1.4rem;
      color: #fff;
    }
    .modal-

    /* Form fields */
    .form-label {
      color: var(--military-green);
      font-weight: 500;
    }
    .form-control:focus {
      border-color: var(--orange-accent);
      box-shadow: 0 0 0 0.15rem rgba(255,191,0,.18);
    }

    /* Product card upgrades */
    .product-card {
      background: #fff;
      border-radius: 20px;
      border: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: box-shadow 0.3s, transform 0.3s;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .product-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 18px 40px rgba(113, 81, 0, 0.15);
    }
    .product-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: var(--light-gray);
      border-bottom: 1px solid #eee;
      border-radius: 20px 20px 0 0;
      display: block;
      margin: 0 auto;
    }
    .product-card-body {
      padding: 1.5rem 1.2rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
    }
    .product-card-title {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--dark-charcoal);
      margin-bottom: 0.5rem;
    }
    .product-card-price {
      color: var(--orange-accent);
      font-weight: 700;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    .product-card-button .btn {
      background: var(--military-green);
      color: #fff !important;
      font-weight: 600;
      border-radius: 40px;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px;
      padding: 8px 25px;
      margin-top: 10px;
    }
    .product-card-button .btn:hover {
      background: var(--orange-accent);
      color: var,(--dark-charcoal) !important;
      box-shadow: 0 6px 20px rgba(255,191,0,.13);
    }

    /* Section title */
    #product-list h2 {
      color: var(--dark-charcoal);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
      main h1 { font-size: 1.5rem; }
      #product-list h2 { font-size: 1.2rem; }
      .product-card-body { padding: 1rem 0.7rem; }
    }

  /* Admin Product Table  Row Style */
.admin-products-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 8px;
}
.admin-products-table th {
  background: var(--military-green, #715100);
  color: #fff;
  font-weight: 600;
  font-size: 1.08em;
  border: none;
  border-radius: 12px 12px 0 0;
  padding: 10px 8px;
}
.admin-products-table td {
  background: #fff;
  vertical-align: middle;
  padding: 12px 8px;
  border-radius: 0 0 12px 12px;
  border-top: 1px solid #f2f2f2;
  font-size: 1.01em;
}
.admin-products-table tr {
  box-shadow: 0 4px 18px rgba(44,44,44,0.07);
  border-radius: 12px;
  transition: box-shadow 0.2s;
}
.admin-products-table tr:hover td {
  background: #f8f9fa;
  box-shadow: 0 8px 22px rgba(255,191,0,0.09);
}
.product-thumb-img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border-radius: 7px;
  border: 1px solid #eee;
  background: #fafafa;
}
.product-title-cell {
  color: var(--military-green, #715100);
  font-weight: 600;
}
.action-btns .btn {
  margin-right: 5px;
  border-radius: 8px !important;
  font-size: 0.95em;
}
.action-btns .btn-danger {
  background: #e84141;
  border: none;
}
.action-btns .btn-danger:hover {
  background: #c81919;
}
.action-btns .btn-secondary {
  background: #715100;
  border: none;
  color: #fff;
}
.action-btns .btn-secondary:hover {
  background: #bb7900;
  color: #fff;
}

    /* Footer styling  */
    
    
    
    
    footer a:hover {
      color: var(--orange-accent) !important;
      text-shadow: 0 0 8px rgba(255, 191, 0, 0.25);
    }
    
    
    
    
    
    
    
    
    
    

    


    .animate-fade-in { animation: fadeInUp 0.8s ease-out;}
  </style>
  <link rel="stylesheet" href="/css/global-ui.css">
</head>
<body>
  <!-- Navbar -->
  <div id="global-navbar"></div>

  <main class="container my-5 animate-fade-in">
    <h1 class="mb-4 text-center"><i class="bi bi-bag me-2"></i>إدارة المنتجات</h1>

    <!-- Add Product Button -->
    <button id="add-product-button" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">إضافة منتج</button>

    <!-- Link to Site Settings Page -->
    <a href="/admin-settings" class="btn btn-primary ms-2">
      <i class="bi bi-gear-fill"></i> إعدادات الموقع (شعار، سلايد، روابط...)
    </a>

    <!-- Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
          <div class="modal-header text-white" style="background: var(--military-green); border-radius: 16px 16px 0 0;">
            <h5 class="modal-title fw-bold" id="addProductModalLabel"><i class="bi bi-plus-circle me-2"></i>إضافة منتج جديد</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
          </div>
          <div class="modal-body p-4 bg-light">
            <form id="add-product-form" enctype="multipart/form-data" class="needs-validation" novalidate>
              <div class="row">
                <!-- Column 1: Basic Info -->
                <div class="col-md-6">
                  <div class="card border-0 shadow-sm mb-4" style="border-radius: 12px;">
                    <div class="card-body">
                      <h6 class="fw-bold mb-3 text-secondary"><i class="bi bi-info-circle me-2"></i>المعلومات الأساسية</h6>
                      <div class="mb-3">
                        <label for="name" class="form-label fw-bold">اسم المنتج <span class="text-danger">*</span></label>
                        <input type="text" id="name" name="name" required class="form-control" style="background: #f8f9fa; border-radius: 8px;" />
                        <div class="invalid-feedback">الرجاء ادخال اسم المنتج.</div>
                      </div>
                      <div class="mb-3">
                        <label for="description" class="form-label fw-bold">تفاصيل المنتج</label>
                        <textarea id="description" name="description" class="form-control" rows="4" style="background: #f8f9fa; border-radius: 8px;"></textarea>
                      </div>
                      <div class="row">
                        <div class="col-6 mb-3">
                          <label for="price" class="form-label fw-bold">السعر (دج) <span class="text-danger">*</span></label>
                          <input type="text" id="price" name="price" required class="form-control" placeholder="مثال: 1200" pattern="^\d+(\.\d{1,2})?$" style="background: #f8f9fa; border-radius: 8px;" />
                          <div class="invalid-feedback">أدخل سعراً صالحاً.</div>
                        </div>
                        <div class="col-6 mb-3">
                          <label for="stock" class="form-label fw-bold">المخزون <span class="text-danger">*</span></label>
                          <input type="text" id="stock" name="stock" required class="form-control" placeholder="مثال: 50" pattern="^[1-9]\d*$" style="background: #f8f9fa; border-radius: 8px;" />
                          <div class="invalid-feedback">أدخل كمية صحيحة.</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                
                <!-- Column 2: Media & Categories -->
                <div class="col-md-6">
                  <div class="card border-0 shadow-sm mb-4" style="border-radius: 12px;">
                    <div class="card-body">
                      <h6 class="fw-bold mb-3 text-secondary"><i class="bi bi-tags me-2"></i>التصنيفات والصور</h6>
                      <div class="mb-3">
                        <label class="form-label fw-bold">الفئات (يمكن اختيار أكثر من واحدة):</label>
                        <div id="category-checkboxes" class="p-3 border rounded" style="background: #f8f9fa;"></div>
                      </div>
                      <div class="mb-3">
                        <label for="images" class="form-label fw-bold">صور المنتج (بحد أقصى 5) <span class="text-danger">*</span></label>
                        <input type="file" id="images" name="images" required accept=".jpg,.jpeg,.png,.gif,.webp" class="form-control" multiple max="5" style="border-radius: 8px;" />
                        <div class="form-text text-muted"><i class="bi bi-images me-1"></i>يمكنك تحديد عدة صور مرة واحدة.</div>
                      </div>
                    </div>
                  </div>
                  
                  <div class="card border-0 shadow-sm mb-3" style="border-radius: 12px;">
                    <div class="card-body">
                      <h6 class="fw-bold mb-3 text-secondary"><i class="bi bi-text-paragraph me-2"></i>فقرات إضافية (اختياري)</h6>
                      <div id="paragraphs-container"></div>
                      <button type="button" class="btn btn-outline-primary btn-sm w-100 mt-2" id="add-paragraph-btn" style="border-radius: 8px;">
                        <i class="bi bi-plus-lg me-1"></i> أضف فقرة مخصصة
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              
              <div id="add-product-message"></div>
              <div class="modal-footer bg-light border-0 px-0 pb-0 justify-content-end" style="border-radius: 0 0 16px 16px;">
                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal" style="border-radius: 8px;">إلغاء</button>
                <button type="submit" class="btn btn-success px-5 fw-bold" style="background: var(--orange-accent); color: var(--dark-charcoal); border: none; border-radius: 8px;"><i class="bi bi-check2-circle me-2"></i>إضافة المنتج</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <section id="product-list" class="mt-5">
      <div id="products-container"></div>
      <!-- سيتم عرض المنتجات هنا -->
    </section>
  </main>

<!-- Updated Footer with better mobile centering -->
<div id="global-footer"></div>


  <!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteProductModal" tabindex="-1" aria-labelledby="deleteProductModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deleteProductModalLabel"><i class="bi bi-trash"></i> حذف المنتج</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body text-center">
        <i class="bi bi-exclamation-triangle display-4 text-danger mb-3"></i>
        <div class="fw-bold mb-3">هل أنت متأكد أنك تريد حذف هذا المنتج؟</div>
        <div id="delete-product-name" class="text-muted"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">الغاء</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger"><i class="bi bi-trash"></i> حذف</button>
      </div>
    </div>
  </div>
</div>

<!-- Update Product Modal -->
<div class="modal fade" id="updateProductModal" tabindex="-1" aria-labelledby="updateProductModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
      <div class="modal-header text-white" style="background: var(--military-green); border-radius: 16px 16px 0 0;">
        <h5 class="modal-title fw-bold" id="updateProductModalLabel"><i class="bi bi-pencil-square me-2"></i>تعديل المنتج</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body p-4 bg-light">
        <div id="update-product-form-container"></div>
      </div>
    </div>
  </div>
</div>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/header.js?v=1736152800"></script>
  <script src="/js/admin-products.js?v=1736152800"></script>
  <script src="/js/branding.js?v=1736152800"></script>
</body>
</html>
