﻿<!DOCTYPE html>
<html lang="ar">
<head>

    

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omervita - تسجيل الخروج</title>
    <meta name="description" content="تسجيل الخروج من حسابك في Omervita. شكراً لاستخدام خدماتنا.">
    <meta name="robots" content="noindex, nofollow">
    <!-- Canonical tag for SEO -->
    <link rel="canonical" href="https://omervita.com/logout">
    <!-- Favicon and manifest -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;

/></noscript>
</head>
<body>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        
        .logout-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        
        .logout-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }
        
        .logout-title {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .logout-message {
            color: #6c757d;
            margin-bottom: 2rem;
        }
        
        .spinner-border {
            width: 2rem;
            height: 2rem;
        }
        
        .success-animation {
            animation: bounceIn 0.6s ease-out;
        }
        
        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
    </style>
    
    <div class="logout-container">
        <div id="loading-state">
            <div class="spinner-border text-primary mb-3" role="status">
                <span class="visually-hidden">جاري تسجيل الخروج...</span>
            </div>
            <h3 class="logout-title">جاري تسجيل الخروج...</h3>
            <p class="logout-message">يرجى الانتظار قليلاً</p>
        </div>
        
        <div id="success-state" class="d-none">
            <i class="bi bi-check-circle-fill logout-icon success-animation"></i>
            <h3 class="logout-title">تم تسجيل الخروج بنجاح!</h3>
            <p class="logout-message">شكراً لاستخدام خدماتنا. سيتم توجيهك إلى صفحة تسجيل الدخول</p>
            <div class="alert alert-success border-0 shadow-sm">
                <i class="bi bi-info-circle me-2"></i>
                تم تسجيل الخروج من جميع الأجهزة بنجاح
            </div>
        </div>
        
        <img data-dynamic-logo class="mt-3" style="max-width: 120px;" alt="Logo" />
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/branding.js"></script>
    <script>
        // Clear the JWT token and any user-related info from localStorage
        localStorage.removeItem('token');
        
        // Call the logout API to clear the server-side cookie
        fetch('/api/logout', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
        })
        .then(response => response.json())
        .then(data => {
            console.log('Logout successful:', data.message);
            
            // Show success state
            document.getElementById('loading-state').classList.add('d-none');
            document.getElementById('success-state').classList.remove('d-none');
            
            // Wait 2 seconds before redirecting
            setTimeout(() => {
                document.querySelector('.logout-container').classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 500);
            }, 2000);
        })
        .catch(error => {
            console.error('Logout error:', error);
            
            // Show success state even on error (user is still logged out locally)
            document.getElementById('loading-state').classList.add('d-none');
            document.getElementById('success-state').classList.remove('d-none');
            
            // Wait 2 seconds before redirecting
            setTimeout(() => {
                document.querySelector('.logout-container').classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 500);
            }, 2000);
        });
    </script>
</body>
</html>
