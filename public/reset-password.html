<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omervita - إعادة تعيين كلمة المرور</title>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --military-green: #715100;
      --light-military: #bb7900;
      --orange-accent: #ffbf00;
      --dark-charcoal: #2c2c2c;
      --light-gray: #f8f9fa;
      --white: #ffffff;
    }
    * { font-family: 'Inter', sans-serif; }

    body {
      background: var(--light-gray);
      padding-top: 120px;
    }

    .reset-card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 10px 32px rgba(44,44,44,0.11);
      padding: 2.7rem 2rem 2.2rem 2rem;
      margin-top: 2.4rem;
      margin-bottom: 2.5rem;
      transition: box-shadow 0.2s;
      max-width: 410px;
      margin-left: auto;
      margin-right: auto;
    }
    .reset-card:hover {
      box-shadow: 0 24px 50px rgba(113, 81, 0, 0.13);
    }
    .reset-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--military-green);
      margin-bottom: 1.9rem;
      text-align: center;
    }
    .form-label {
      color: var(--military-green);
      font-weight: 500;
    }
    .form-control {
      border-radius: 12px;
      padding: 0.95rem 1rem;
      font-size: 1.05em;
      border: 1.2px solid #e0e0e0;
      box-shadow: none;
      transition: border 0.18s;
    }
    .form-control:focus {
      border-color: var(--orange-accent);
      box-shadow: 0 0 0 0.10rem rgba(255,191,0,.16);
    }
    .btn-primary {
      background: var(--orange-accent);
      color: var(--dark-charcoal) !important;
      border: none;
      font-weight: 600;
      padding: 0.8rem 0;
      border-radius: 16px;
      transition: background 0.3s, color 0.2s, box-shadow 0.2s, transform 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 1.13em;
      box-shadow: 0 4px 16px rgba(232,123,25,0.11);
    }
    .btn-primary:hover {
      background: var(--military-green);
      color: #fff !important;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(113, 81, 0, 0.11);
    }
    @media (max-width: 600px) {
      .reset-card { padding: 1.2rem 0.7rem 1.5rem 0.7rem;}
      main { padding: 0 0.2rem;}
    }
  </style>
</head>
<body>
  <main>
    <div class="reset-card">
      <h1><i class="bi bi-lock me-2"></i>إعادة تعيين كلمة المرور</h1>
      <form id="reset-password-form" novalidate>
        <div class="mb-3">
          <label for="newPassword" class="form-label">كلمة المرور الجديدة:</label>
          <input type="password" id="newPassword" name="newPassword" required class="form-control" 
                 placeholder="أدخل كلمة المرور الجديدة" minlength="8" />
          <div class="form-text text-muted">يجب أن تحتوي كلمة المرور على 8 أحرف على الأقل</div>
        </div>
        <div class="mb-4">
          <label for="confirmPassword" class="form-label">تأكيد كلمة المرور:</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required class="form-control"
                 placeholder="أعد إدخال كلمة المرور الجديدة" />
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-check-circle me-1"></i>تحديث كلمة المرور
        </button>
      </form>
      <div id="reset-message" class="mt-3"></div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
