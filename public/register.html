  <style>
    :root {
      --military-green: #715100;
      --light-military: #bb7900;
      --orange-accent: #ffbf00;
      --dark-charcoal: #2c2c2c;
      --light-gray: #f8f9fa;
      --white: #ffffff;
    }
    * { font-family: 'cairo', 'Inter', sans-serif; }

    body {
      background: var(--light-gray);
      padding-top: 120px;
    }

    .navbar-nav .nav-link {
      transition: color 0.3s, background-color 0.3s, transform 0.2s;
      border-radius: 8px;
      margin: 0 4px;
      font-weight: 500;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link:focus {
      color: var(--white) !important;
      background: linear-gradient(135deg, var(--military-green), var(--light-military));
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 93, 35, 0.3);
    }
    .navbar-brand {
      font-weight: 700 !important;
      color: var(--military-green) !important;
      font-size: 1.7rem;
      letter-spacing: 1px;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
    }
    .register-card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 10px 32px rgba(44,44,44,0.11);
      padding: 2.7rem 2rem 2.2rem 2rem;
      margin-top: 2.4rem;
      margin-bottom: 2.5rem;
      transition: box-shadow 0.2s;
    }
    .register-card:hover {
      box-shadow: 0 24px 50px rgba(113, 81, 0, 0.13);
    }
    .register-card h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--military-green);
      margin-bottom: 2.2rem;
      text-align: center;
    }
    .form-label {
      color: var(--military-green);
      font-weight: 500;
    }
    .form-control {
      border-radius: 12px;
      padding: 0.95rem 1rem;
      font-size: 1.05em;
      border: 1.2px solid #e0e0e0;
      box-shadow: none;
      transition: border 0.18s;
    }
    .form-control:focus {
      border-color: var(--orange-accent);
      box-shadow: 0 0 0 0.10rem rgba(255,191,0,.16);
    }
    .btn-primary {
      background: var(--orange-accent);
      color: var(--dark-charcoal) !important;
      border: none;
      font-weight: 600;
      padding: 0.8rem 0;
      border-radius: 16px;
      transition: background 0.3s, color 0.2s, box-shadow 0.2s, transform 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 1.13em;
      box-shadow: 0 4px 16px rgba(232,123,25,0.11);
    }
    .btn-primary:hover {
      background: var(--military-green);
      color: #fff !important;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(113, 81, 0, 0.11);
    }
    #register-message {
      min-height: 30px;
      font-size: 1.03em;
      font-weight: 500;
    }
    /* Two-column form */
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }
    .form-col {
      flex: 1 1 220px;
      min-width: 0;
    }
    @media (max-width: 991px) {
      .form-row { flex-direction: row; gap: 0; }
      .form-col { width: 100%; }
      .register-card { padding: 1.2rem 0.7rem 1.5rem 0.7rem;}
      main { padding: 0 0.2rem;}
    }
    /* Footer */
    
    
    
    
    footer a:hover {
      color: var(--orange-accent) !important;
      text-shadow: 0 0 8px rgba(255, 191, 0, 0.25);
    }

}

  <link rel="stylesheet" href="/css/global-ui.css">

<body>
  <!-- Navbar -->
  <div id="global-navbar"></div>

  <main>
    <div class="register-card">
      <h1><i class="bi bi-person-plus me-2"></i>تسجيل</h1>
      <form id="register-form" novalidate autocomplete="off">
        <div class="mb-3">
          <label for="name" class="form-label">الاسم:</label>
          <input type="text" id="name" name="name" required minlength="3" pattern="^[a-zA-ZğüşıöçĞÜŞİÖÇ ]{3,}$" class="form-control" placeholder="اسمك" />
          <div class="invalid-feedback">يجب أن يتكون من 3 أحرف على الأقل، ويجب استخدام أحرف فقط.</div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">البريد الإلكتروني:</label>
          <input type="email" id="email" name="email" required class="form-control" placeholder="عنوان بريدك الإلكتروني" />
          <div class="invalid-feedback">يرجى إدخال بريد إلكتروني صالح.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">كلمة المرور:</label>
          <input type="password" id="password" name="password" required minlength="8"
            pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+{}\[\]:;<>,.?~\-\/\\]).{8,}$"
            class="form-control" placeholder="كلمة مرورك" />
          <div class="form-text">
            يجب أن تتكون من 8 أحرف لاتينية على الأقل، واحتواء على حرف كبير واحد، ورقم واحد، ورمز واحد.
          </div>
          <div class="invalid-feedback">يجب أن تتوافق كلمة المرور مع القواعد.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2"><i class="bi bi-person-plus me-1"></i>تسجيل</button>
      </form>
      <div id="register-message" class="mt-3"></div>
    </div>
  </main>

  <!-- Updated Footer with better mobile centering -->
<div id="global-footer"></div>

  <!-- Bootstrap JS Bundle CDN (Popper + Bootstrap JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/header.js?v=1736152800"></script>
  <script src="/js/branding.js?v=1736152800"></script>
  <script>
    // Modern form validation for Register
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('register-form');
      form.addEventListener('submit', function (e) {
        let valid = true;
        // Trigger default Bootstrap validation
        if (!form.checkValidity()) {
          valid = false;
        }

        // Custom: Name (en az 3 harf ve sadece harfler)
        const name = form.name.value.trim();
        if (!/^[a-zA-ZğüşıöçĞÜŞİÖÇ ]{3,}$/.test(name)) {
          form.name.classList.add('is-invalid');
          valid = false;
        } else {
          form.name.classList.remove('is-invalid');
        }

        // Password
        const password = form.password.value;
        if (!/^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+{}\[\]:;<>,.?~\-\/\\]).{8,}$/.test(password)) {
          form.password.classList.add('is-invalid');
          valid = false;
        } else {
          form.password.classList.remove('is-invalid');
        }

        // Email default browser
        // No additional validation needed for simplified form

        if (!valid) {
          e.preventDefault();
          e.stopPropagation();
        }
        form.classList.add('was-validated');
      });
    });
  </script>
  <script src="/js/register.js?v=1736152800"></script>



</body>
