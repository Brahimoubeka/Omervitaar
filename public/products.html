<!DOCTYPE html>
<html lang="ar">
<head>

  

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Omervita - المنتجات</title>
  <meta name="description" content="تسوق منتجات العناية الشخصية الطبيعية من Omervita. مجموعة واسعة من المنتجات عالية الجودة للعناية بالبشرة والشعر. توصيل سريع وأسعار منافسة.">
  
  <!-- Open Graph Tags -->
  <meta property="og:title" content="Omervita - منتجات العناية الطبيعية">
  <meta property="og:description" content="تسوق منتجات العناية الشخصية الطبيعية من Omervita. مجموعة واسعة من المنتجات عالية الجودة للعناية بالبشرة والشعر.">
  <meta property="og:image" content="https://lpflwkuvxwuigifmzaxb.supabase.co/storage/v1/object/public/branding/logo.png">
  <meta property="og:url" content="https://omervita.com/products">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Omervita - منتجات العناية الطبيعية">
  <meta name="twitter:description" content="تسوق منتجات العناية الشخصية الطبيعية من Omervita. مجموعة واسعة من المنتجات عالية الجودة.">
  <meta name="twitter:image" content="https://lpflwkuvxwuigifmzaxb.supabase.co/storage/v1/object/public/branding/logo.png">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://omervita.com/products">
  
  <!-- Breadcrumb Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "الرئيسية",
        "item": "https://omervita.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "المنتجات",
        "item": "https://omervita.com/products"
      }
    ]
  }
  </script>
  

  <!-- Canonical tag for SEO -->
  <link rel="canonical" href="https://omervita.com/products">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Add Cairo Arabic font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  
  
  <link rel="stylesheet" href="/css/products.css">

  

  <!-- Product Structured Data (JSON-LD) placeholder for SEO -->
  <script id="products-jsonld" type="application/ld+json"></script>
  <link rel="stylesheet" href="/css/global-ui.css">
</head>
<body>
  <!-- Bootstrap Navbar -->
  <div id="global-navbar"></div>

  <main class="container my-5" dir="rtl">
    <h1 class="mb-4 text-center"><i class="bi bi-basket me-2"></i>منتجاتنا</h1>
    
    <!-- Products Page Auto-Size Carousel (3s interval, clickable with "شاهد الآن" button) -->
    <div id="productsPageCarouselSection" class="mb-4" style="display: none;">
      <div class="products-hero-carousel-wrap mx-auto position-relative shadow-sm" style="max-width: 980px; border-radius: 18px; overflow: hidden; background: #fff; border: 1px solid rgba(90, 99, 68, 0.14);">
        <div id="productsPageCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="3000">
          <div class="carousel-indicators" id="productsCarouselIndicators" style="z-index: 15; margin-bottom: 0.6rem;"></div>
          <div class="carousel-inner" id="productsCarouselInner"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#productsPageCarousel" data-bs-slide="prev" aria-label="السابق" style="width: 44px;">
            <span class="carousel-control-prev-icon bg-dark bg-opacity-50 rounded-circle p-2" aria-hidden="true"></span>
            <span class="visually-hidden">السابق</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#productsPageCarousel" data-bs-slide="next" aria-label="التالي" style="width: 44px;">
            <span class="carousel-control-next-icon bg-dark bg-opacity-50 rounded-circle p-2" aria-hidden="true"></span>
            <span class="visually-hidden">التالي</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Filter & Search Section - Minimized (use sliding panel for full filters) -->
    <div class="filter-section p-2 mb-3 bg-white rounded-3 shadow-sm" style="border: 1px solid #eee;">
      <div class="row align-items-center">
        <div class="col-8">
          <small class="text-muted"><i class="bi bi-info-circle me-1"></i>استخدم زر الفلتر للوصول إلى جميع خيارات التصفية</small>
        </div>
        <div class="col-4 text-end">
          <button class="btn btn-sm btn-outline-primary" onclick="document.getElementById('filterToggleBtn').click()">
            <i class="bi bi-funnel me-1"></i>فتح الفلاتر
          </button>
        </div>
      </div>
      
      <!-- Hidden original filter elements for JavaScript functionality (Mobile relies on these) -->
      <div style="display: none;" id="hidden-filters">
        <!-- These are replaced by the desktop sidebar below -->
      </div>
    </div>

    <!-- Active Filters Display -->
    <div class="mb-3">
      <div id="active-filters" class="d-flex flex-wrap gap-2"></div>
    </div>

    <!-- Page Layout: Desktop Sidebar + Products Grid -->
    <div class="page-layout">
      <!-- Desktop Sidebar -->
      <aside class="desktop-sidebar sliding-filter-panel-content">
        <h5 class="mb-4 text-military"><i class="bi bi-funnel me-2"></i>تصفية وبحث</h5>
        
        <!-- Search Section -->
        <div class="sliding-filter-section mb-4">
          <h6><i class="bi bi-search"></i>البحث</h6>
          <input type="text" id="search-bar" class="form-control sliding-filter-control w-100" placeholder="ابحث في المنتجات...">
        </div>

        <!-- Category Section -->
        <div class="sliding-filter-section mb-4">
          <h6><i class="bi bi-tags"></i>الفئة</h6>
          <select id="category-filter" class="form-select sliding-filter-control">
            <option value="">جميع الفئات</option>
          </select>
        </div>

        <!-- Price Section -->
        <div class="sliding-filter-section mb-4">
          <h6><i class="bi bi-currency-dollar"></i>السعر</h6>
          <div class="d-flex gap-2">
            <input type="number" id="min-price" class="form-control sliding-filter-control" placeholder="الأقل" min="0">
            <input type="number" id="max-price" class="form-control sliding-filter-control" placeholder="الأكثر" min="0">
          </div>
        </div>

        <!-- Rating Section -->
        <div class="sliding-filter-section mb-4">
          <h6><i class="bi bi-star"></i>التقييم</h6>
          <select id="rating-filter" class="form-select sliding-filter-control">
            <option value="">جميع التقييمات</option>
            <option value="1">⭐ وما فوق</option>
            <option value="2">⭐⭐ وما فوق</option>
            <option value="3">⭐⭐⭐ وما فوق</option>
            <option value="4">⭐⭐⭐⭐ وما فوق</option>
            <option value="5">⭐⭐⭐⭐⭐ فقط</option>
          </select>
        </div>

        <!-- Sort Section -->
        <div class="sliding-filter-section mb-4">
          <h6><i class="bi bi-sort-down"></i>الترتيب</h6>
          <select id="price-sort" class="form-select sliding-filter-control">
            <option value="">ترتيب السعر</option>
            <option value="asc">من الأرخص للأغلى</option>
            <option value="desc">من الأغلى للأرخص</option>
          </select>
        </div>

        <button id="clear-filters" class="sliding-clear-filters w-100">
          <i class="bi bi-trash me-1"></i>مسح الفلاتر
        </button>
      </aside>

      <!-- Main Products Area -->
      <div class="products-main-area">
        <!-- Container to display products -->
        <div id="products-container" class="row row-cols-2 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
          <!-- JS will fill product cards here -->
        </div>
      </div> <!-- End .products-main-area -->
    </div> <!-- End .page-layout -->
  </main>

  <!-- Filter Toggle Button -->
  <button class="filter-toggle-btn" id="filterToggleBtn" title="فتح مرشح المنتجات">
    <i class="bi bi-funnel-fill"></i>
  </button>

  <!-- Filter Panel Overlay -->
  <div class="sliding-filter-panel-overlay" id="filterPanelOverlay"></div>

  <!-- Sliding Filter Panel -->
  <div class="sliding-filter-panel" id="slidingFilterPanel">
    <div class="sliding-filter-panel-header">
      <h5><i class="bi bi-funnel me-2"></i>تصفية وبحث المنتجات</h5>
      <button class="sliding-filter-panel-close" id="filterPanelClose" title="إغلاق">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    
    <div class="sliding-filter-panel-content">
      <!-- Search Section -->
      <div class="sliding-filter-section">
        <h6><i class="bi bi-search"></i>البحث</h6>
        <input
          type="text"
          id="sliding-search-bar"
          class="form-control sliding-filter-control w-100"
          placeholder="ابحث في المنتجات..."
          aria-label="ابحث في المنتجات"
        />
      </div>

      <!-- Category Section -->
      <div class="sliding-filter-section">
        <h6><i class="bi bi-tags"></i>الفئة</h6>
        <select id="sliding-category-filter" class="form-select sliding-filter-control">
          <option value="">كل الفئات</option>
          <!-- JS will fill options -->
        </select>
      </div>

      <!-- Price Range Section -->
      <div class="sliding-filter-section">
        <h6><i class="bi bi-currency-dollar"></i>نطاق السعر</h6>
        <div class="row g-2">
          <div class="col-6">
            <div class="input-group">
              <span class="input-group-text bg-transparent">من</span>
              <input type="number" id="sliding-min-price" class="form-control sliding-filter-control" placeholder="دج">
            </div>
          </div>
          <div class="col-6">
            <div class="input-group">
              <span class="input-group-text bg-transparent">إلى</span>
              <input type="number" id="sliding-max-price" class="form-control sliding-filter-control" placeholder="دج">
            </div>
          </div>
        </div>
      </div>

      <!-- Rating Section -->
      <div class="sliding-filter-section">
        <h6><i class="bi bi-star"></i>التقييم</h6>
        <select id="sliding-rating-filter" class="form-select sliding-filter-control">
          <option value="">جميع التقييمات</option>
          <option value="5">5★</option>
          <option value="4">4★+</option>
          <option value="3">3★+</option>
          <option value="2">2★+</option>
          <option value="1">1★+</option>
        </select>
      </div>

      <!-- Price Sorting Section -->
      <div class="sliding-filter-section">
        <h6><i class="bi bi-sort-numeric-down"></i>ترتيب حسب السعر</h6>
        <select id="sliding-price-sort" class="form-select sliding-filter-control">
          <option value="">بدون ترتيب</option>
          <option value="asc">من الأرخص للأغلى</option>
          <option value="desc">من الأغلى للأرخص</option>
        </select>
      </div>

      <!-- Active Filters Section -->
      <div class="sliding-active-filters">
        <h6><i class="bi bi-check-circle"></i>الفلاتر النشطة</h6>
        <div id="sliding-active-filters" class="d-flex flex-wrap gap-2">
          <!-- JS will fill active filters here -->
          <span class="badge bg-light text-secondary border">لا توجد فلاتر نشطة</span>
        </div>
      </div>

      <!-- Clear Filters Button -->
      <button id="sliding-clear-filters" class="sliding-clear-filters">
        <i class="bi bi-x-circle me-2"></i>إزالة جميع الفلاتر
      </button>
    </div>
  </div>

  

  <!-- Updated Footer with better mobile centering -->
<div id="global-footer"></div>
  <!-- Bootstrap JS Bundle CDN (Popper + Bootstrap JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/header.js?v=1736152800"></script>
  <script src="/js/slug-util.js?v=1736152800"></script>
  <script src="/js/products.js?v=1736152800"></script>
<script src="/js/branding.js?v=1736152800"></script>




  <!-- Cart Popup Modal -->
  <div class="modal fade" id="cartPopupModal" tabindex="-1" aria-labelledby="cartPopupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="cartPopupModalLabel"><i class="bi bi-cart-check me-2"></i>تمت الإضافة إلى السلة</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex align-items-center mb-3">
            <div class="me-3 text-center">
              <i class="bi bi-check-circle-fill text-success" style="font-size: 2.5rem;"></i>
            </div>
            <div>
              <h6 class="mb-1 fw-bold" id="cartPopupProductName"></h6>
              <p class="mb-0 text-muted" id="cartPopupProductPrice"></p>
            </div>
          </div>
          <div id="cartPopupItemsList" class="border-top border-bottom py-3 my-3">
            <!-- Cart items will be displayed here -->
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold">إجمالي السلة:</span>
            <span class="fw-bold text-success" id="cartPopupTotal"></span>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="bi bi-arrow-return-left me-1"></i>متابعة التسوق
          </button>
          <a href="/cart" class="btn btn-success">
            <i class="bi bi-cart-fill me-1"></i>إتمام الطلب
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
