    :root {
      --military-green: #715100;
      --light-military: #bb7900;
      --orange-accent: #ffbf00;
      --dark-charcoal: #2c2c2c;
      --light-gray: #f8f9fa;
      --white: #ffffff;
    }
    * { font-family: 'cairo', 'Inter', sans-serif; }

    body {
      background: var(--light-gray);
      padding-top: 120px;
    }

    .navbar-nav .nav-link {
      transition: color 0.3s, background-color 0.3s, transform 0.2s;
      border-radius: 8px;
      margin: 0 4px;
      font-weight: 500;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link:focus {
      color: var(--white) !important;
      background: linear-gradient(135deg, var(--military-green), var(--light-military));
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 93, 35, 0.3);
    }
    .navbar-brand {
      font-weight: 700 !important;
      color: var(--military-green) !important;
      font-size: 1.7rem;
      letter-spacing: 1px;
    }
    .navbar.fixed-top {
      backdrop-filter: blur(10px);
      background: rgba(248, 249, 250, 0.95) !important;
      transition: all 0.3s;
    }

    main {
      max-width: 410px;
      margin: 0 auto;
    }
    .login-card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 10px 32px rgba(44,44,44,0.11);
      padding: 2.7rem 2rem 2.2rem 2rem;
      margin-top: 2.4rem;
      margin-bottom: 2.5rem;
      transition: box-shadow 0.2s;
    }
    .login-card:hover {
      box-shadow: 0 24px 50px rgba(113, 81, 0, 0.13);
    }
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--military-green);
      margin-bottom: 1.9rem;
      text-align: center;
    }
    .form-label {
      color: var(--military-green);
      font-weight: 500;
    }
    .form-control {
      border-radius: 12px;
      padding: 0.95rem 1rem;
      font-size: 1.05em;
      border: 1.2px solid #e0e0e0;
      box-shadow: none;
      transition: border 0.18s;
    }
    .form-control:focus {
      border-color: var(--orange-accent);
      box-shadow: 0 0 0 0.10rem rgba(255,191,0,.16);
    }
    .btn-primary {
      background: var(--orange-accent);
      color: var(--dark-charcoal) !important;
      border: none;
      font-weight: 600;
      padding: 0.8rem 0;
      border-radius: 16px;
      transition: background 0.3s, color 0.2s, box-shadow 0.2s, transform 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 1.13em;
      box-shadow: 0 4px 16px rgba(232,123,25,0.11);
    }
    .btn-primary:hover {
      background: var(--military-green);
      color: #fff !important;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(113, 81, 0, 0.11);
    }
    #login-message {
      min-height: 30px;
      font-size: 1.03em;
      font-weight: 500;
    }
    .main-link {
      color: var(--military-green);
      font-weight: 600;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .main-link:hover {
      color: var(--orange-accent);
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      .login-card { padding: 1.2rem 0.7rem 1.5rem 0.7rem;}
      main { padding: 0 0.2rem;}
    }

<body>
  <!-- Navbar -->
  <div id="global-navbar"></div>

  <main>
    <div class="login-card">
      <h1><i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول</h1>      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">البريد الإلكتروني:</label>
          <input type="email" id="email" name="email" required class="form-control" placeholder="بريدك الإلكتروني" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">كلمة المرور:</label>
          <input type="password" id="password" name="password" required class="form-control" placeholder="كلمة المرور" />
          <div class="text-end mt-1">
            <a href="#" id="forgot-password-link" class="text-muted small"><i class="bi bi-question-circle me-1"></i>نسيت كلمة المرور؟</a>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2"><i class="bi bi-box-arrow-in-right me-1"></i>تسجيل الدخول</button>
      </form>
      <p class="mt-3 text-center">
        ليس لديك حساب؟
        <a href="/register" class="main-link"><i class="bi bi-person-plus me-1"></i>أنشئ حسابك من هنا</a>
      </p>
      <div id="login-message" class="mt-3 text-center"></div>
    </div>
  </main>
