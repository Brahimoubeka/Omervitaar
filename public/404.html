<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة - Omervita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background: #f8f9fa; }
    .error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .error-content { text-align: center; background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .error-icon { font-size: 6rem; color: #ffbf00; margin-bottom: 2rem; }
    .error-title { font-size: 2.5rem; font-weight: 700; color: #715100; margin-bottom: 1rem; }
    .error-description { color: #6c757d; margin-bottom: 2rem; }
    .btn-home { background: linear-gradient(135deg, #715100, #bb7900); border: none; padding: 12px 30px; font-weight: 600; }
    .btn-home:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(113, 81, 0, 0.3); }
  </style>
</head>
<body dir="rtl">
  <div class="error-container">
    <div class="error-content">
      <div class="error-icon">
        <i class="bi bi-exclamation-triangle"></i>
      </div>
      <h1 class="error-title">404</h1>
      <h2 class="h4 mb-3">الصفحة غير موجودة</h2>
      <p class="error-description">
        عذراً، الصفحة التي تبحث عنها غير موجودة أو قد تكون قد تم نقلها.
      </p>
      <div class="d-flex gap-3 justify-content-center">
        <a href="/" class="btn btn-primary btn-home">
          <i class="bi bi-house-fill me-2"></i>العودة للرئيسية
        </a>
        <a href="/products" class="btn btn-outline-primary">
          <i class="bi bi-shop me-2"></i>تصفح المنتجات
        </a>
      </div>
    </div>
  </div>
</body>
</html>
